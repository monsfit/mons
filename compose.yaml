name: regolith

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regolith}
      POSTGRES_USER: ${POSTGRES_USER:-regolith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regolith_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - regolith-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  regolith-postgres:
