name: mons-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - mons-prometheus:/prometheus
    networks:
      - monitoring
    mem_limit: 1536m
    cpus: 1.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin-password
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mons-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /etc/mons/monitoring/grafana-admin-password:/run/secrets/admin-password:ro
    networks:
      - monitoring
      - tailscale-publish
    depends_on:
      - prometheus
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/lib/mons-monitoring/textfile:/var/lib/node-exporter/textfile:ro
    networks:
      - monitoring
    pid: host
    read_only: true
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    privileged: true
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  postgres-exporter-dev:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.limit=50
      - --collector.stat_statements.query_length=160
    environment:
      DATA_SOURCE_URI: postgres-dev:5432/postgres?sslmode=require
      DATA_SOURCE_USER: mons_dev_monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres-password
    volumes:
      - /etc/mons/monitoring/postgres-dev-password:/run/secrets/postgres-password:ro
    networks:
      - monitoring
      - database
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  postgres-exporter-prod:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.limit=50
      - --collector.stat_statements.query_length=160
    environment:
      DATA_SOURCE_URI: postgres-prod:5432/postgres?sslmode=require
      DATA_SOURCE_USER: mons_prod_monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres-password
    volumes:
      - /etc/mons/monitoring/postgres-prod-password:/run/secrets/postgres-password:ro
    networks:
      - monitoring
      - database
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

networks:
  monitoring:
    internal: true
  database:
    external: true
    name: mons_database
  tailscale-publish:

volumes:
  mons-prometheus:
  mons-grafana:
