global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter-personal:9187]
        labels:
          environment: personal
      - targets: [postgres-exporter-dev:9187]
        labels:
          environment: dev
      - targets: [postgres-exporter-prod:9187]
        labels:
          environment: prod
