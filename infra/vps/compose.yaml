name: mons

services:
  postgres-personal:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: mons_personal
      POSTGRES_USER: mons_personal_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MONS_APP_DATABASE_USER: mons_personal_app
      MONS_MIGRATION_DATABASE_USER: mons_personal_migration
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mons-postgres-personal:/var/lib/postgresql
      - /etc/mons/postgres/personal:/run/mons-secrets:ro
      - /etc/mons/postgres/personal/tls:/run/mons-tls:ro
    networks:
      database:
        aliases:
          - postgres-personal.internal.mons.fit
      tailscale-publish:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres-dev:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: mons_dev
      POSTGRES_USER: mons_dev_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MONS_APP_DATABASE_USER: mons_dev_app
      MONS_MIGRATION_DATABASE_USER: mons_dev_migration
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - mons-postgres-dev:/var/lib/postgresql
      - /etc/mons/postgres/dev:/run/mons-secrets:ro
      - /etc/mons/postgres/dev/tls:/run/mons-tls:ro
    networks:
      database:
        aliases:
          - postgres-dev.internal.mons.fit
      tailscale-publish:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres-prod:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: mons_prod
      POSTGRES_USER: mons_prod_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MONS_APP_DATABASE_USER: mons_prod_app
      MONS_MIGRATION_DATABASE_USER: mons_prod_migration
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - mons-postgres-prod:/var/lib/postgresql
      - /etc/mons/postgres/prod:/run/mons-secrets:ro
      - /etc/mons/postgres/prod/tls:/run/mons-tls:ro
      - /etc/mons/pgbackrest:/run/mons-pgbackrest:ro
    networks:
      database:
        aliases:
          - postgres-prod.internal.mons.fit
      tailscale-publish:
      backup-egress:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    profiles: [cloudflare]
    depends_on:
      postgres-personal:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy
      postgres-prod:
        condition: service_healthy
    volumes:
      - /etc/mons/cloudflared/tunnel-token:/run/secrets/tunnel-token:ro
    networks:
      - database
      - cloudflare-egress
    restart: unless-stopped

networks:
  database:
    internal: true
  tailscale-publish:
  cloudflare-egress:
  backup-egress:

volumes:
  mons-postgres-personal:
  mons-postgres-dev:
  mons-postgres-prod:
