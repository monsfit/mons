name: Remove branch preview

on:
  delete:

concurrency:
  group: preview-${{ github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  remove:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'dev'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: deployment
        run: node scripts/deployment-identity.ts --branch "${{ github.event.ref }}" --environment preview --format github >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Remove Worker and route
        run: pnpm exec sst remove --stage "${{ steps.deployment.outputs.previewStage }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Remove preview media
        run: pnpm preview:media:cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MONS_STORAGE_PREFIX: ${{ steps.deployment.outputs.r2Prefix }}
      - name: Drop preview schema
        run: pnpm --filter @mons/database branch:drop -- --branch "${{ github.event.ref }}"
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
