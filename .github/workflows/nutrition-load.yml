name: Load nutrition release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable nutrition release ID
        required: true
        type: string
      target:
        description: Database environment
        required: true
        type: choice
        options:
          - personal
          - dev
          - production

concurrency:
  group: nutrition-load-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  load:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project services/nutrition-ingest --locked
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Load release
        run: >-
          uv run --project services/nutrition-ingest nutrition-ingest load
          --release "$NUTRITION_RELEASE_ID"
        env:
          NUTRITION_RELEASE_ID: ${{ inputs.release }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MONS_DATABASE_RUNTIME_USER: ${{ secrets.MONS_DATABASE_RUNTIME_USER }}
