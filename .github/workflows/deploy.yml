name: Deploy canonical environment

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: deployment
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            echo 'stage=production' >> "$GITHUB_OUTPUT"
          else
            echo 'stage=dev' >> "$GITHUB_OUTPUT"
          fi
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Migrate database
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MONS_APP_SCHEMA: mons_app
          MONS_DATABASE_RUNTIME_USER: ${{ secrets.MONS_DATABASE_RUNTIME_USER }}
      - name: Deploy API
        run: ./scripts/deploy-api.sh "${{ steps.deployment.outputs.stage }}"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify API
        run: |
          api_url=$(node scripts/deployment-identity.ts --stage "${{ steps.deployment.outputs.stage }}" --format url)
          curl --fail --retry 8 --retry-delay 5 "$api_url/health"
