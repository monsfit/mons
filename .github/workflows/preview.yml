name: Branch preview

on:
  push:
    branches-ignore: [main, dev]

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: deployment
        run: node scripts/deployment-identity.ts --environment preview --format github >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Migrate preview schema
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MONS_APP_SCHEMA: ${{ steps.deployment.outputs.appSchema }}
          MONS_CATALOG_SCHEMA: mons_catalog
          MONS_DATABASE_RUNTIME_USER: ${{ secrets.MONS_DATABASE_RUNTIME_USER }}
      - name: Deploy preview
        run: pnpm exec sst deploy --stage "${{ steps.deployment.outputs.previewStage }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify preview
        run: curl --fail --retry 8 --retry-delay 5 "https://${{ steps.deployment.outputs.apiDomain }}/health"

