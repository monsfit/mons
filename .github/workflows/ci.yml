name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: mons
          POSTGRES_USER: mons
          POSTGRES_PASSWORD: mons_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mons -d mons"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mons:mons_local@localhost:5432/mons
      MONS_DATABASE_RUNTIME_USER: mons
      MONS_TEST_DATABASE_URL: postgresql://mons:mons_local@localhost:5432/mons
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm openapi:check

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: mons
          POSTGRES_USER: mons
          POSTGRES_PASSWORD: mons_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mons -d mons"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONS_TEST_DATABASE_URL: postgresql://mons:mons_local@localhost:5432/mons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project services/nutrition-ingest --locked --all-extras
      - run: uv run --project services/nutrition-ingest ruff check services/nutrition-ingest
      - run: uv run --project services/nutrition-ingest mypy --config-file services/nutrition-ingest/pyproject.toml services/nutrition-ingest/titan
      - run: uv run --project services/nutrition-ingest python -m unittest discover -s services/nutrition-ingest/tests -v
      - run: uv run --project services/nutrition-ingest nutrition-ingest schema --check

  mons:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: >-
          xcodebuild build -quiet
          -project clients/ios/mons.xcodeproj
          -scheme 'Mons Dev'
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - run: >-
          xcodebuild test
          -project clients/ios/mons.xcodeproj
          -scheme 'Mons Dev'
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
