name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ci: ${{ steps.filter.outputs.ci }}
      database: ${{ steps.filter.outputs.database }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      mons: ${{ steps.filter.outputs.mons }}
      postgres: ${{ steps.filter.outputs.postgres }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: .github/ci-paths.yml

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mons:mons_local@localhost:5432/mons
      MONS_DATABASE_RUNTIME_USER: mons
      MONS_TEST_DATABASE_URL: postgresql://mons:mons_local@localhost:5432/mons
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start test PostgreSQL
        if: needs.changes.outputs.postgres == 'true'
        run: |
          docker run --detach --rm \
            --name mons-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=mons \
            --env POSTGRES_USER=mons \
            --env POSTGRES_PASSWORD=mons_local \
            postgres:18.4-alpine

          for attempt in {1..30}; do
            if docker exec mons-ci-postgres pg_isready -U mons -d mons; then
              exit 0
            fi
            sleep 1
          done

          docker logs mons-ci-postgres
          exit 1
      - name: Check formatting
        run: pnpm format:check
      - name: Check affected packages
        env:
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
        run: |
          if [[ "$CI_CHANGED" == 'true' ]]; then
            pnpm exec turbo run lint typecheck test build
          else
            pnpm exec turbo run lint typecheck test build --affected
          fi
      - name: Check migrations are repeatable
        if: needs.changes.outputs.database == 'true'
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Check generated OpenAPI document
        if: needs.changes.outputs.api == 'true'
        run: pnpm openapi:check

  mons:
    name: Mons iOS
    needs: changes
    if: needs.changes.outputs.mons == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path clients/ios -Xswiftc -warnings-as-errors
      - run: >-
          xcodebuild build -quiet
          -project clients/ios/mons.xcodeproj
          -scheme 'Mons Dev'
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - run: >-
          xcodebuild test
          -project clients/ios/mons.xcodeproj
          -scheme 'Mons Dev'
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

  infrastructure:
    name: VPS infrastructure
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: find infra/vps -type f -name '*.sh' -exec bash -n {} +
      - name: Check Compose configuration
        run: |
          docker compose -f infra/vps/compose.yaml config --quiet
          docker compose -f infra/vps/monitoring/compose.yaml config --quiet

  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - infrastructure
      - mons
      - typescript
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          MONS_RESULT: ${{ needs.mons.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$INFRASTRUCTURE_RESULT" \
            "$MONS_RESULT" \
            "$TYPESCRIPT_RESULT"; do
            if [[ "$result" != 'success' && "$result" != 'skipped' ]]; then
              echo "Required CI job finished with result: $result"
              exit 1
            fi
          done
