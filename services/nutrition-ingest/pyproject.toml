[project]
name = "nutrition-ingest"
version = "0.2.0"
description = "Build, publish, and load immutable Mons nutrition releases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
nutrition-ingest = "nutrition_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nutrition_ingest*"]
exclude = ["data*", "tests*"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "B905", "UP042"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["data/"]

[tool.coverage.run]
source = ["nutrition_ingest"]

[tool.coverage.report]
skip_empty = true
